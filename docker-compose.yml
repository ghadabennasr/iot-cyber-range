services:

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: iot-mqtt-broker
    restart: unless-stopped

    ports:
      - "127.0.0.1:1883:1883"

    volumes:
      - ./Broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./Broker/acl.conf:/mosquitto/config/acl.conf
      - ./Broker/passwordfile:/mosquitto/config/passwordfile
      - broker-logs:/mosquitto/log

    networks:
      - cyberrange
      - host-access

  honeypot:
    build:
      context: ./Lab
    command: ["python", "/app/honeypot.py"]
    restart: unless-stopped
    volumes:
      - ./Lab/runtime:/events
    networks:
      - cyberrange

  security-monitor:
    build:
      context: ./Lab
    command: ["python", "/app/monitor.py"]
    restart: unless-stopped
    depends_on:
      - mqtt-broker
      - honeypot
    secrets:
      - ids_password
    environment:
      # Set in .env (git-ignored). Empty = the block button is disabled (fails closed).
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
    volumes:
      - ./Lab/runtime:/events
      - broker-logs:/mosquitto/log:ro
    networks:
      - cyberrange

  dashboard-proxy:
    image: nginx:alpine
    restart: unless-stopped
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    depends_on:
      - security-monitor
    ports:
      # Security dashboard (host 8081; 8080 is often taken by other local services)
      - "127.0.0.1:8081:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./Lab/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cyberrange
      - host-access

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyberrange
      POSTGRES_USER: cyberrange
      # Set in .env (git-ignored). Postgres refuses to start with an empty password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberrange -d cyberrange"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend-db

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
    environment:
      MQTT_HOST: mqtt-broker
      # Read-only broker account (ACL: read facility/#). Empty = ingestion disabled.
      BACKEND_MQTT_USER: backend
      BACKEND_MQTT_PASSWORD: ${BACKEND_MQTT_PASSWORD:-}
      # The only account allowed to write facility/lock1/cmd. Empty = no lock commands.
      CONTROLLER_MQTT_USER: controller
      CONTROLLER_MQTT_PASSWORD: ${CONTROLLER_MQTT_PASSWORD:-}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      # Bearer token for POST endpoints. Empty = write endpoints disabled (fails closed).
      API_TOKEN: ${API_TOKEN:-}
    ports:
      # Application API (host 8082; the security dashboard already uses 8081)
      - "127.0.0.1:8082:8000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - cyberrange
      - backend-db
      - host-access

  attacker:
    build:
      context: ./Attacker
    profiles: ["tools"]
    entrypoint: ["python", "/app/attacker.py"]
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    networks:
      - cyberrange

networks:
  cyberrange:
    internal: true
  host-access:
  # Database network: only postgres and the backend are attached to it.
  backend-db:
    internal: true

volumes:
  broker-logs:
  postgres-data:

secrets:
  ids_password:
    file: ./Broker/ids.password
